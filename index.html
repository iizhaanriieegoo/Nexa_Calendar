<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA Calendar — V2.1</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#172033;--muted:#70798a;--line:#e6e8ee;--accent:#3b5bdb;--soft:#eef2ff;--green:#2f9e72;--orange:#e67700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800;margin:4px 10px 28px}.logo span{color:var(--accent)}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#4d5667;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:var(--soft);color:var(--accent);font-weight:650}.side-title{margin:24px 10px 8px;color:#9aa1af;font-size:11px;text-transform:uppercase;letter-spacing:1px}.agenda{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:14px;color:#555f70}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px;font-size:13px}.profile b{display:block}
main{padding:22px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{font-size:25px;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:white;color:#465063;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.calendar-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(20,30,55,.06)}.cal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:10px;color:#8c94a2;font-size:12px;border-bottom:1px solid var(--line)}.day{min-height:125px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.day:nth-child(7n){border-right:0}.num{font-size:12px;color:#747d8d}.today .num{display:grid;place-items:center;width:25px;height:25px;background:var(--accent);color:#fff;border-radius:50%}.event{margin-top:7px;padding:7px 8px;border-radius:7px;background:#eef2ff;color:#3049a8;font-size:12px;cursor:pointer}.event.green{background:#e8f7f0;color:#267052}.event.orange{background:#fff2df;color:#995b08}
.modal-back{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);align-items:center;justify-content:center;padding:20px;z-index:5}.modal{width:min(540px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal h2{margin:0 0 15px}.form{display:grid;gap:12px}.form label{font-size:12px;color:#687184}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.voice-orb-wrap{position:relative;width:150px;height:120px;margin:2px auto 0;display:grid;place-items:center}.mic{position:relative;z-index:3;width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 10px 28px rgba(59,91,219,.3);transition:transform .12s ease}.mic.listening{box-shadow:0 0 0 5px rgba(59,91,219,.08),0 10px 28px rgba(59,91,219,.3)}.voice-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.voice-rings span{position:absolute;width:92px;height:92px;border:2px solid rgba(59,91,219,.18);border-radius:50%;transform:scale(1);opacity:.5;transition:transform .07s linear,opacity .07s linear}.voice-rings span:nth-child(2){width:112px;height:112px;border-color:rgba(59,91,219,.11)}.voice-rings span:nth-child(3){width:132px;height:132px;border-color:rgba(59,91,219,.07)}.voice-state{text-align:center;margin:14px 0;color:#596477;font-size:14px}.hint{background:var(--soft);padding:12px;border-radius:10px;color:#3f4f96;font-size:13px}.confirm{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 28px;box-shadow:0 18px 55px rgba(20,30,55,.18);font-weight:650;z-index:30}.toast{display:none;position:fixed;right:22px;top:22px;background:#172033;color:white;padding:13px 16px;border-radius:10px;z-index:20}
.agenda-list{display:grid;gap:10px}.agenda-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;align-items:center;justify-content:space-between}.agenda-left{display:flex;gap:11px;align-items:center}.agenda-card button{background:var(--soft);color:var(--accent);border:0;border-radius:8px;padding:7px 10px;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(59,91,219,.12)}}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}main{padding:15px}.day{min-height:95px}.event{font-size:10px;padding:5px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
<div class="logo">NEXA<span>.</span></div>
<div class="nav">
<button id="navCal" class="active" onclick="showView('calendar')">▦ &nbsp; Calendario</button>
<button id="navAg" onclick="showView('agendas')">☰ &nbsp; Mis agendas</button>
<button id="navShared" onclick="showView('shared')">♧ &nbsp; Compartidas</button>

</div>
<div class="side-title">Mis agendas</div>
<div id="sideAgendas"></div>
<div class="profile"><b>Usuario Demo</b>Cuenta de prueba</div>
</aside>
<main>
<div class="top"><h1 id="title">Calendario</h1><div class="actions"><button class="btn" onclick="today()">Hoy</button><button class="btn primary" onclick="openEvent()">＋ Nueva cita</button></div></div>
<div id="content"></div>
</main>
</div>

<div class="toast" id="toast"></div><div class="confirm" id="confirm">Actualización realizada</div>

<div class="modal-back" id="eventModal"><div class="modal">
<h2 id="eventTitle">Nueva cita</h2><div class="form">
<label>Título<input id="evName" placeholder="Ej. Reunión con Carlos"></label>
<div class="row"><label>Fecha<input id="evDate" type="date"></label><label>Hora<input id="evTime" type="time"></label></div>
<div class="row"><label>Duración<select id="evDuration"><option>30 min</option><option selected>1 hora</option><option>2 horas</option><option>Todo el día</option></select></label><label>Agenda<select id="evAgenda"></select></label></div>
<label>Notas<textarea id="evNotes" rows="3" placeholder="Detalles opcionales"></textarea></label></div>
<div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveEvent()">Guardar</button></div>
</div></div>

</div>

<script>
const agendas=[
{id:'trabajo',name:'Trabajo',color:'blue'},{id:'personal',name:'Personal',color:'green'},{id:'proyecto',name:'Proyecto',color:'orange'}
];
let events=[
{id:1,title:"Reunión de equipo",date:"2026-09-08",time:"10:00",duration:"1 hora",agenda:"trabajo"},
{id:2,title:"Comida con Laura",date:"2026-09-10",time:"14:00",duration:"1 hora",agenda:"personal"},
{id:3,title:"Entrega proyecto",date:"2026-09-11",time:"16:00",duration:"2 horas",agenda:"proyecto"},
{id:4,title:"Llamada con Carlos",date:"2026-09-15",time:"11:30",duration:"30 min",agenda:"trabajo"}
];
let cursor=new Date(), editingId=null;

let recognition=null, listening=false, audioStream=null, audioCtx=null, analyser=null, voiceRAF=null;
let voiceBuffer=[], heardOnce=false, recognitionSupported=true, lastFinalIndex=0;

const pad=n=>String(n).padStart(2,'0'), key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function agendaById(id){return agendas.find(a=>a.id===id)||agendas[0]}

function renderSide(){
 document.getElementById('sideAgendas').innerHTML=agendas.map(a=>`<div class="agenda"><i class="dot ${a.color==='green'?'green':a.color==='orange'?'orange':''}"></i>${a.name}</div>`).join('');
 document.getElementById('evAgenda').innerHTML=agendas.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')
}

function renderCal(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
 let out='<section class="calendar-card"><div class="cal-head"><button class="btn" onclick="changeMonth(-1)">‹</button><b>'+new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(cursor)+'</b><button class="btn" onclick="changeMonth(1)">›</button></div><div class="week">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="grid">';
 for(let i=0;i<42;i++){
   let day=i-start+1,dt=new Date(y,m,day),inMonth=day>=1&&day<=days;
   if(!inMonth){let dd=day<1?prev+day:day-days;out+=`<div class="day"><div class="num" style="opacity:.35">${dd}</div></div>`;continue}
   let k=key(y,m,day),todayK=key(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
   out+=`<div class="day ${k===todayK?'today':''}" ondblclick="openEvent('${k}')"><div class="num">${day}</div>`;
   events.filter(e=>e.date===k).forEach(e=>{let c=agendaById(e.agenda).color;out+=`<div class="event ${c==='green'?'green':c==='orange'?'orange':''}" onclick="editEvent(${e.id})">${escapeHtml(e.time)} · ${escapeHtml(e.title)}</div>`});
   out+='</div>';
 }
 out+='</div></section>';document.getElementById('content').innerHTML=out;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderSide();renderCal()}
function showView(v){
 document.getElementById('navCal').classList.toggle('active',v==='calendar');
 document.getElementById('navAg').classList.toggle('active',v==='agendas');
 document.getElementById('navShared').classList.toggle('active',v==='shared');
 document.getElementById('title').textContent=v==='calendar'?'Calendario':v==='agendas'?'Mis agendas':'Compartidas';
 if(v==='calendar')renderCal();
 else if(v==='agendas')document.getElementById('content').innerHTML='<div class="agenda-list">'+agendas.map(a=>`<div class="agenda-card"><div class="agenda-left"><i class="dot ${a.color==='green'?'green':a.color==='orange'?'orange':''}"></i><div><b>${a.name}</b><div style="color:#8a92a0;font-size:12px">${events.filter(e=>e.agenda===a.id).length} eventos</div></div></div><button onclick="toast('La edición de agendas se habilitará en la siguiente versión')">Gestionar</button></div>`).join('')+'</div>';
 else document.getElementById('content').innerHTML='<div class="agenda-card"><div><b>Agenda conjunta</b><div style="color:#7b8494;font-size:13px;margin-top:5px">En la siguiente versión podrás invitar usuarios y sincronizar cambios en tiempo real.</div></div></div>'
}
function changeMonth(n){cursor.setMonth(cursor.getMonth()+n);renderCal()}
function today(){cursor=new Date();renderCal()}
function openEvent(date){
 editingId=null;document.getElementById('eventTitle').textContent='Nueva cita';document.getElementById('evName').value='';document.getElementById('evNotes').value='';
 document.getElementById('evDate').value=date||key(cursor.getFullYear(),cursor.getMonth(),cursor.getDate());document.getElementById('evTime').value='10:00';document.getElementById('evDuration').value='1 hora';document.getElementById('evAgenda').value='trabajo';document.getElementById('eventModal').style.display='flex'
}
function editEvent(id){
 let e=events.find(x=>x.id===id);if(!e)return;
 editingId=id;document.getElementById('eventTitle').textContent='Editar cita';document.getElementById('evName').value=e.title;document.getElementById('evDate').value=e.date;document.getElementById('evTime').value=e.time;document.getElementById('evDuration').value=e.duration;document.getElementById('evAgenda').value=e.agenda;document.getElementById('eventModal').style.display='flex'
}
function closeModal(){document.getElementById('eventModal').style.display='none'}
function minutes(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function durationMinutes(d){return d==='30 min'?30:d==='2 horas'?120:d==='Todo el día'?1440:60}
function overlaps(a,b){let a1=minutes(a.time),a2=a1+durationMinutes(a.duration),b1=minutes(b.time),b2=b1+durationMinutes(b.duration);return a1<b2&&b1<a2}
function checkOverlap(candidate,ignoreId){return events.some(e=>e.id!==ignoreId&&e.date===candidate.date&&e.agenda===candidate.agenda&&overlaps(candidate,e))}
function saveEvent(){
 let title=document.getElementById('evName').value.trim();if(!title){toast('Escribe un título');return}
 let d={title,date:document.getElementById('evDate').value,time:document.getElementById('evTime').value,duration:document.getElementById('evDuration').value,agenda:document.getElementById('evAgenda').value};
 if(checkOverlap(d,editingId)){alert('⚠️ Hay otra cita que coincide en esta agenda.\n\nCámbiala de hora o selecciona otra agenda para evitar que se sobrepongan.');return}
 if(editingId)Object.assign(events.find(e=>e.id===editingId),d);else events.push({id:Date.now(),...d});
 closeModal();renderCal();showConfirmation()
}
function {
 document.getElementById('aiModal').style.display='flex';
 document.getElementById('voiceState').innerHTML='Pulsa el micrófono para empezar. Pulsa otra vez para ejecutar la orden.';
 document.getElementById('heard').textContent='';document.getElementById('aiResult').textContent=''
}
function closeAI(){document.getElementById('aiModal').style.display='none';stopVoice()}

function beep(){
 try{
   const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   const c=new C(),o=c.createOscillator(),g=c.createGain();
   o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);
   g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.16);
   o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.17);
   setTimeout(()=>{try{c.close()}catch(_){}},300)
 }catch(_){}
}
function toggleVoice(){if(listening)finishVoice();else startVoice()}

async function startVoice(){
 if(listening)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   document.getElementById('voiceState').textContent='Este navegador no ofrece reconocimiento de voz. Puedes usar el cuadro de texto de abajo.';
   toast('Reconocimiento de voz no disponible en este navegador');return
 }
 listening=true;voiceBuffer=[];heardOnce=false;lastFinalIndex=0;
 document.getElementById('micBtn').classList.add('listening');
 document.getElementById('voiceState').innerHTML='Escuchando… <b>habla normalmente</b>. Pulsa de nuevo para ejecutar.';
 document.getElementById('heard').textContent='';

 // The analyser is best-effort and NEVER blocks recognition.
 try{
   if(navigator.mediaDevices?.getUserMedia){
     audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
     audioCtx=new (window.AudioContext||window.webkitAudioContext)();
     if(audioCtx.state==='suspended')await audioCtx.resume();
     const source=audioCtx.createMediaStreamSource(audioStream);
     analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.78;source.connect(analyser);animateVoice()
   }
 }catch(err){
   // Do not abort speech recognition if the visual meter cannot access the mic.
   document.getElementById('voiceState').textContent='Escuchando… (medidor de voz no disponible). Pulsa de nuevo para ejecutar.'
 }

 recognition=new SR();
 recognition.lang='es-ES';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=3;

 recognition.onresult=e=>{
   let finalParts=[],interimParts=[];
   for(let i=e.resultIndex;i<e.results.length;i++){
     const text=e.results[i][0]?.transcript?.trim();if(!text)continue;
     if(e.results[i].isFinal)finalParts.push(text);else interimParts.push(text)
   }
   if(finalParts.length){
     voiceBuffer.push(...finalParts);
     if(!heardOnce){heardOnce=true;beep();toast('Te he escuchado');}
   }
   const shown=[...voiceBuffer,...interimParts].join(' ').trim();
   if(shown)document.getElementById('heard').textContent='“'+shown+'”';
 };

 recognition.onerror=e=>{
   if(!listening)return;
   if(e.error==='not-allowed'||e.error==='service-not-allowed'){
     document.getElementById('voiceState').textContent='Permiso de micrófono denegado. Activa el micrófono para este sitio y vuelve a pulsar.'
   }else if(e.error==='audio-capture'){
     document.getElementById('voiceState').textContent='No puedo acceder al micrófono. Comprueba que ninguna otra aplicación lo esté usando.'
   }else if(e.error==='no-speech'){
     document.getElementById('voiceState').textContent='Sigo escuchando… aún no he detectado una frase.'
   }else{
     document.getElementById('voiceState').textContent='Sigo escuchando…'
   }
 };

 recognition.onend=()=>{
   // Some browsers end recognition after a pause. Restart while the button remains active.
   if(listening&&recognition){
     setTimeout(()=>{if(listening&&recognition){try{recognition.start()}catch(_){}}},180)
   }
 };
 try{recognition.start()}
 catch(err){
   document.getElementById('voiceState').textContent='No se pudo iniciar el reconocimiento. Revisa el permiso del micrófono y vuelve a intentarlo.';
   stopVoice()
 }
}

function finishVoice(){
 if(!listening)return;
 const text=voiceBuffer.join(' ').trim() || document.getElementById('heard').textContent.replace(/[“”]/g,'').trim();
 stopVoice();
 if(!text){
   document.getElementById('voiceState').textContent='No he recibido ninguna orden. Pulsa el micrófono y vuelve a hablar.';
   return
 }
 document.getElementById('heard').textContent='“'+text+'”';
 document.getElementById('voiceState').textContent='Ejecutando…';
 /* AI disabled */ processAI(text)
}

function animateVoice(){
 if(!listening||!analyser)return;
 const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);let sum=0;
 for(let i=0;i<data.length;i++){const n=(data[i]-128)/128;sum+=n*n}
 const rms=Math.sqrt(sum/data.length),level=Math.min(1,Math.max(0,(rms-.012)*7.5)),rings=document.getElementById('voiceRings');
 rings.querySelectorAll('span').forEach((ring,i)=>{ring.style.transform=`scale(${1+level*.48+i*.035})`;ring.style.opacity=String(.22+level*(.62-i*.08))});
 document.getElementById('micBtn').style.transform=`scale(${1+level*.055})`;
 voiceRAF=requestAnimationFrame(animateVoice)
}
function stopVoice(){
 listening=false;
 if(voiceRAF)cancelAnimationFrame(voiceRAF);voiceRAF=null;
 if(recognition){const r=recognition;recognition=null;try{r.onend=null;r.stop()}catch(_){}}
 if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null}
 if(audioCtx){try{audioCtx.close()}catch(_){}audioCtx=null}
 analyser=null;
 document.getElementById('micBtn')?.classList.remove('listening');document.getElementById('micBtn')?.style.removeProperty('transform');
 document.querySelectorAll('#voiceRings span').forEach((ring,i)=>{ring.style.transform='scale(1)';ring.style.opacity=String(.5-i*.12)})
}

// -------- Natural-language calendar parser (local, no fake "AI") --------
const MONTHS={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
function normalizeText(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function parseDateInfo(t){
 const now=new Date(),n=normalizeText(t),d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 if(/\bpasado manana\b/.test(n)){d.setDate(d.getDate()+2);return {date:key(d.getFullYear(),d.getMonth(),d.getDate()),confidence:1}}
 if(/\bmanana\b/.test(n)){d.setDate(d.getDate()+1);return {date:key(d.getFullYear(),d.getMonth(),d.getDate()),confidence:1}}
 if(/\bhoy\b/.test(n)){return {date:key(d.getFullYear(),d.getMonth(),d.getDate()),confidence:1}}
 let m=n.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
 if(m){let y=m[3]?+m[3]:(now.getFullYear());if(y<100)y+=2000;let x=new Date(y,+m[2]-1,+m[1]);return {date:key(x.getFullYear(),x.getMonth(),x.getDate()),confidence:.95}}
 for(const [name,idx] of Object.entries(MONTHS)){
   const r=new RegExp(`\\b(\\d{1,2})\\s+de?\\s+${name}\\b`);
   const mm=n.match(r);if(mm){let x=new Date(now.getFullYear(),idx,+mm[1]);if(x<new Date(now.getFullYear(),now.getMonth(),now.getDate()))x.setFullYear(x.getFullYear()+1);return {date:key(x.getFullYear(),x.getMonth(),x.getDate()),confidence:.9}}
 }
 return {date:key(d.getFullYear(),d.getMonth(),d.getDate()),confidence:.4}
}
function parseTime(t){
 const n=normalizeText(t);
 let m=n.match(/\b(?:a\s+las|a\s+la|sobre\s+las|sobre\s+la|para\s+las|para\s+la|a)\s*(\d{1,2})(?:[:\.](\d{2}))?\s*(am|pm|h|horas?)?\b/);
 if(!m)m=n.match(/\b(\d{1,2})(?:[:\.](\d{2}))?\s*(am|pm|h|horas?)\b/);
 if(!m)m=n.match(/\b(\d{1,2}):(\d{2})\b/);
 if(!m)return null;
 let h=+m[1],min=+(m[2]||0),ap=(m[3]||'').toLowerCase();
 if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
 if(h>23||min>59)return null;
 return `${pad(h)}:${pad(min)}`
}
function parseAgenda(t){
 const n=normalizeText(t);
 if(/\b(personal|privada|privado)\b/.test(n))return 'personal';
 if(/\b(proyecto|proyectos)\b/.test(n))return 'proyecto';
 if(/\b(trabajo|laboral|oficina)\b/.test(n))return 'trabajo';
 return 'trabajo'
}
function parseDuration(t){
 const n=normalizeText(t);
 if(/\btodo el dia\b/.test(n))return 'Todo el día';
 let m=n.match(/(\d+)\s*(?:hora|horas)\b/);if(m)return +m[1]===2?'2 horas':'1 hora';
 m=n.match(/(\d+)\s*(?:min|minuto|minutos)\b/);if(m)return '30 min';
 return '1 hora'
}
function parseTitle(t){
 const n=normalizeText(t);
 // Explicit title forms: "que se llama X", "llamada X", "cita llamada X", "titulo X"
 let m=n.match(/\b(?:que se llama|llamada|titulo|titulada)\s+(.+?)(?=\s+(?:manana|pasado manana|hoy|a las?|para las?|en (?:trabajo|personal|proyecto))\b|$)/);
 if(m){let x=m[1].trim();return capitalizeTitle(x)}
 m=n.match(/\b(?:reunion|reunión)\s+(?:con\s+)?(.+?)(?=\s+(?:manana|pasado manana|hoy|a las?|para las?|en (?:trabajo|personal|proyecto))\b|$)/);
 if(m)return 'Reunión con '+capitalizeTitle(m[1].replace(/^con\s+/,''));
 m=n.match(/\b(?:con)\s+([a-záéíóúñ][a-záéíóúñ ]{1,50}?)(?=\s+(?:manana|pasado manana|hoy|a las?|para las?|en (?:trabajo|personal|proyecto))\b|$)/i);
 if(m)return 'Cita con '+capitalizeTitle(m[1].trim());
 if(/\b(reunion|reunión)\b/.test(n))return 'Reunión';
 if(/\bllamada\b/.test(n))return 'Llamada';
 if(/\bcomida\b/.test(n))return 'Comida';
 if(/\bcita\b/.test(n))return 'Cita';
 return null
}
function capitalizeTitle(s){return s.replace(/\s+/g,' ').trim().split(' ').map(w=>w?w.charAt(0).toUpperCase()+w.slice(1):w).join(' ')}
function isDelete(n){return /\b(?:cancela|cancelar|cancela la|elimina|eliminar|borra|borrar|quita|quitar)\b/.test(n)}
function isChange(n){return /\b(?:mueve|mover|cambia|cambiar|reprograma|reprogramar)\b/.test(n)}

function /* AI disabled */ processAI(raw){
 const original=String(raw||'').trim();if(!original)return;
 const n=normalizeText(original), dateInfo=parseDateInfo(n), date=dateInfo.date, time=parseTime(n)||'10:00', agenda=parseAgenda(n), duration=parseDuration(n);
 const explicitTitle=parseTitle(original);

 // DELETE: identify by date/time first, then title/name.
 if(isDelete(n)){
   let found=events.find(e=>e.date===date&&e.time===time);
   if(!found&&explicitTitle)found=events.find(e=>e.date===date&&normalizeText(e.title).includes(normalizeText(explicitTitle)));
   if(found){events=events.filter(e=>e.id!==found.id);renderCal();showConfirmation();say(`He eliminado "${found.title}".`)}
   else say(`No encuentro una cita para ${date} a las ${time}.`);
   return
 }

 // CHANGE: move an existing event. If a new time is given, use it; otherwise report.
 if(isChange(n)){
   let found=events.find(e=>e.date===date&&e.time===time);
   if(!found)found=events.find(e=>e.date===date&&(explicitTitle?normalizeText(e.title).includes(normalizeText(explicitTitle)):true));
   if(found){
     const old={...found}, newTime=parseTime(n);
     if(newTime){
       const candidate={...found,time:newTime};
       if(checkOverlap(candidate,found.id)){say('Ese cambio provocaría un solapamiento con otra cita. No lo he aplicado.');return}
       found.time=newTime;renderCal();showConfirmation();say(`He cambiado "${found.title}" de las ${old.time} a las ${newTime}.`)
     }else say(`He encontrado "${found.title}", pero necesito una hora nueva para moverla.`);
   }else say('No encuentro una cita que pueda modificar con esos datos.');
   return
 }

 // CREATE: use the user's explicit title whenever possible.
 const title=explicitTitle||'Cita';
 const candidate={id:Date.now(),title,date,time,duration,agenda};
 if(checkOverlap(candidate,null)){say(`No la he creado porque se solapa con otra cita de ${agendaById(agenda).name} a las ${time}.`);return}
 events.push(candidate);renderCal();showConfirmation();
 const prettyDate=new Date(date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
 say(`He creado "${title}" el ${prettyDate} a las ${time} en la agenda ${agendaById(agenda).name}.`);
}

function say(msg){
 document.getElementById('aiResult').textContent='✓ '+msg;document.getElementById('voiceState').textContent=msg;toast(msg);
 if('speechSynthesis' in window){
   speechSynthesis.cancel();
   const speak=()=>{
     const voices=speechSynthesis.getVoices(),spanish=voices.filter(v=>/^es([_-])/i.test(v.lang));
     const preferred=spanish.find(v=>/Microsoft|Google|Natural|Neural|Siri|Helena|Laura/i.test(v.name))||spanish.find(v=>/es-ES/i.test(v.lang))||spanish[0]||voices[0];
     const u=new SpeechSynthesisUtterance(msg);u.lang=preferred?.lang||'es-ES';if(preferred)u.voice=preferred;u.rate=.92;u.pitch=1.02;u.volume=1;speechSynthesis.speak(u)
   };
   if(speechSynthesis.getVoices().length)speak();else speechSynthesis.onvoiceschanged=speak
 }
}
function showConfirmation(){let x=document.getElementById('confirm');x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}

render();
</script>
